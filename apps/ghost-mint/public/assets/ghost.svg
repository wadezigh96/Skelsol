<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="400" height="440" role="img" aria-label="A ghost under a crescent moon">
  <!--
    The GHOST carrier NFT image: the same original line art as the
    Ghost Mint hero (a ghost under a crescent moon, drawn for Skelsol),
    adapted as a standalone file. The dark background is part of the
    art: NFT viewers often show images on white, where the white line
    art would disappear. The maroon glow is inlined as an SVG filter,
    since the page CSS does not apply to this file.
  -->
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7f1d1d" flood-opacity="0.9"/>
    </filter>
  </defs>
  <rect width="200" height="220" fill="#0a0a0a"/>
  <g filter="url(#glow)" fill="none" stroke="#ffffff" stroke-width="3">
    <path d="M165 28 A28 28 0 1 0 165 84 A22 22 0 1 1 165 28 Z" stroke-linejoin="round"/>
    <path d="M100 25 C62 25 42 58 42 98 L42 178 L61 162 L80 178 L100 162 L120 178 L139 162 L158 178 L158 98 C158 58 138 25 100 25 Z" fill="#160505" stroke-linejoin="round"/>
  </g>
  <g fill="#ffffff">
    <ellipse cx="82" cy="95" rx="7" ry="10"/>
    <ellipse cx="118" cy="95" rx="7" ry="10"/>
    <ellipse cx="100" cy="125" rx="8" ry="11"/>
    <circle cx="28" cy="40" r="2.5"/>
    <circle cx="175" cy="130" r="2.5"/>
    <circle cx="20" cy="120" r="2"/>
  </g>
</svg>
